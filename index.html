<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>俄罗斯方块 Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrap">
    <canvas id="board" width="300" height="600"></canvas>

    <aside class="panel">
      <h1>俄罗斯方块</h1>

      <div class="box">
        <span class="label">下一个</span>
        <canvas id="next" width="120" height="120"></canvas>
      </div>

      <div class="box score-box">
        <div class="row"><span class="label">分数</span><span id="score">0</span></div>
        <div class="row"><span class="label">最高分</span><span id="best">0</span></div>
        <div class="row"><span class="label">等级</span><span id="level">1</span></div>
        <div class="row"><span class="label">消行</span><span id="lines">0</span></div>
      </div>

      <button id="restart" type="button">重新开始</button>

      <div class="help">
        <p>← → 左右移动</p>
        <p>↑ 旋转</p>
        <p>↓ 软降</p>
        <p>空格 直落</p>
        <p>P 暂停</p>
      </div>
    </aside>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-content">
      <h2 id="overlay-title">游戏结束</h2>
      <p id="overlay-text">按回车或点击按钮重新开始</p>
      <button id="overlay-btn" type="button">重新开始</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
